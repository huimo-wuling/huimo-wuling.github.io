    <main class="content">
        <section class="hero">
            <h1>角色</h1>
            <p class="hero-subtitle">浮陵镇的住客们</p>
        </section>

        <section class="recent-stories">
            <h2>登场角色</h2>
            <div class="story-list">
                <article class="character-card">
                    <img src="../images/character-linyuan.jpg" alt="林远">
                    <div class="character-info">
                        <span class="character-role">主角</span>
                        <h3><a href="#">林远</a></h3>
                        <p>浮陵镇旧书店"遗忘书廊"的店主，七年前从一场昏睡中醒来后发现记忆受损，并失去了关于妹妹林晓的所有人的记忆。他成为了唯一记得林晓存在的人，一直在寻找她消失的真相。</p>
                    </div>
                </article>
                <article class="character-card">
                    <img src="../images/character-linxiao.jpg" alt="林晓">
                    <div class="character-info">
                        <span class="character-role">关键角色</span>
                        <h3><a href="#">林晓</a></h3>
                        <p>林远的妹妹，在七年前的大雾中消失。只有林远记得她的存在。据说她与那场大雾有着某种神秘的联系……</p>
                    </div>
                </article>
                <article class="character-card">
                    <img src="../images/character-laochen.jpg" alt="老陈">
                    <div class="character-info">
                        <span class="character-role">配角</span>
                        <h3><a href="#">老陈</a></h3>
                        <p>钟楼管理员，知晓许多关于浮陵镇的古老秘密。他总是喜欢在清晨来钟楼附近散步，说是能听到过去的回声。</p>
                    </div>
                </article>
            </div>
        </section>
